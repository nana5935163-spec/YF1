mixed-port: 7890
allow-lan: false
mode: rule
ipv6: false
tun:
    enable: true
    stack: gvisor
    auto-route: true
    auto-detect-interface: true
    dns-hijack:
        - any:53
        - tcp://any:53
log-level: info
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
profile:
    store-selected: true
    store-fake-ip: true
geox-url:
